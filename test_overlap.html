<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
</head>

      <table class="w-full">
        <thead class="bg-slate-900/80 backdrop-blur-md sticky top-0 z-30 text-white">
          <tr><th>Col 1</th><th>Col 2</th></tr>
        </thead>
        <tbody>
          <tr><td class="h-[200px] bg-blue-500">Row 1</td><td>Row 1</td></tr>
          <tr><td class="h-[200px] bg-green-500">Row 2</td><td>Row 2</td></tr>
          <tr><td class="h-[200px] bg-purple-500">Row 3</td><td>Row 3</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
