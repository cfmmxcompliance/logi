<!DOCTYPE html>
<html>
<head>
<style>
  .table-row { background-color: #fff; }
</style>
</head>
<body style="padding: 2rem;">
  <div style="overflow: auto; width: 400px; height: 200px; border: 1px solid black;">
    <table style="width: 800px; border-collapse: collapse;">
      <thead style="position: sticky; top: 0; z-index: 10; background: #eee;">
        <tr>
          <th style="position: sticky; left: 0; z-index: 30; background: #ddd;">H1 (Left Only)</th>
          <th style="position: sticky; top: 0; left: 100px; z-index: 30; background: #ddd;">H2 (Top+Left)</th>
          <th>H3</th>
        </tr>
      </thead>
      <tbody>
        <tr><td style="height: 400px;">Data</td><td>Data</td><td>Data</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
