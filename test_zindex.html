<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8">
  <div class="overflow-auto w-[500px] h-[300px] border">
    <table class="w-[800px]">
      <thead class="sticky top-0 z-30 bg-gray-300">
        <tr>
          <th class="sticky left-0 z-40 bg-red-300 border w-32">Sticky H1</th>
          <th class="sticky left-32 z-40 bg-red-300 border w-32">Sticky H2</th>
          <th class="border bg-gray-300">Normal H3</th>
          <th class="border bg-gray-300">Normal H4</th>
        </tr>
      </thead>
      <tbody>
        <tr class="bg-blue-100">
          <td class="sticky left-0 z-20 bg-blue-100 border">Sticky C1</td>
          <td class="sticky left-32 z-20 bg-blue-100 border">Sticky C2</td>
          <td class="border h-[200px]">Normal C3</td>
          <td class="border">Normal C4</td>
        </tr>
        <tr class="bg-blue-200">
          <td class="sticky left-0 z-20 bg-blue-200 border">Sticky C1</td>
          <td class="sticky left-32 z-20 bg-blue-200 border">Sticky C2</td>
          <td class="border h-[200px]">Normal C3</td>
          <td class="border">Normal C4</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
